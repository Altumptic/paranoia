name: Signature packs

# Rebuilds the ready-made library signatures in sigs/ and re-measures them on
# independently built programs. Runs only when the packs, the generator, the
# matcher or the manifest change.
#
# The packs are tied to the toolchain versions recorded in sigs/manifest.json:
# a `--check` run fails when a newer compiler or linker no longer reproduces the
# documented recognition rates, which means `node scripts/build-sigpack.mjs`
# must be run and the regenerated packs committed.

on:
  push:
    branches: [main]
    paths:
      - 'sigs/**'
      - 'scripts/build-sigpack.mjs'
      - 'crates/paranoia-core/src/sigs.rs'
      - '.github/workflows/sigpacks.yml'
  pull_request:
    paths:
      - 'sigs/**'
      - 'scripts/build-sigpack.mjs'
      - 'crates/paranoia-core/src/sigs.rs'
      - '.github/workflows/sigpacks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sigpacks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msvc:
    name: MSVC CRT pack (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the CLI
        run: cargo build --release --locked -p paranoia-cli
      - name: Rebuild the MSVC pack and check the committed one
        run: node scripts/build-sigpack.mjs msvc --check --work "$env:RUNNER_TEMP\sigpack-work"
      - name: Go on Windows needs no signature pack (pclntab check)
        run: node scripts/build-sigpack.mjs go --check --work "$env:RUNNER_TEMP\sigpack-go"

  libc:
    name: Rust std and musl packs (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install the Rust target used for the pack sample
        run: rustup target add x86_64-unknown-linux-musl
      - name: Build the CLI
        run: cargo build --release --locked -p paranoia-cli
      - name: Rebuild the Rust std and musl packs and check the committed ones
        run: node scripts/build-sigpack.mjs rust musl --check --work "$RUNNER_TEMP/sigpack-work"
      - name: Go on Linux needs no signature pack (pclntab check)
        run: node scripts/build-sigpack.mjs go --check --work "$RUNNER_TEMP/sigpack-go"
