name: Feature request
description: Suggest something Paranoia could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task first, then the feature. What do you do today instead?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Other tools that do this, file types or architectures involved.
