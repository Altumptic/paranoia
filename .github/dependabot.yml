# Weekly update proposals for pinned actions and dependencies. Every update goes through
# CI (tests + cargo/npm audit) and review before it is merged.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # 0.61 builds its Windows bindings with dlltool, which the gnu toolchain used for local
      # Windows builds does not have. Take it when that is no longer the case.
      - dependency-name: windows-sys
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
