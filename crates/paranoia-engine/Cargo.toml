[package]
name = "paranoia-engine"
description = "Native analysis engine process for the Paranoia desktop app (JSON-RPC over stdio)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "paranoia-engine"
path = "src/main.rs"

[dependencies]
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder"] }
paranoia-core.workspace = true
paranoia-db.workspace = true
serde.workspace = true
serde_json.workspace = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_System_Memory", "Win32_Security", "Win32_System_Kernel", "Win32_System_SystemInformation"] }
