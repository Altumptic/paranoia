[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/paranoia-re/paranoia"
authors = ["Paranoia contributors"]
rust-version = "1.82"

[workspace.dependencies]
paranoia-core = { path = "crates/paranoia-core" }
paranoia-db = { path = "crates/paranoia-db" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The browser engine is size-sensitive.
[profile.release.package.paranoia-wasm]
opt-level = "s"
