[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Altumptic/paranoia"
authors = ["Paranoia contributors"]
rust-version = "1.88"

[workspace.dependencies]
paranoia-core = { path = "crates/paranoia-core" }
paranoia-db = { path = "crates/paranoia-db" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
mem_forget = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The browser engine is size-sensitive.
[profile.release.package.paranoia-wasm]
opt-level = "s"
